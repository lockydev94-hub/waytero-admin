<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565C0"/>
      <stop offset="100%" style="stop-color:#0D47A1"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#bg)"/>
  <!-- W letter for WayTero -->
  <text x="16" y="22" font-family="Arial,sans-serif" font-size="17" font-weight="800"
        fill="white" text-anchor="middle" letter-spacing="-1">W</text>
  <!-- Small accent line at bottom -->
  <rect x="8" y="25" width="16" height="2" rx="1" fill="rgba(255,255,255,0.4)"/>
</svg>
